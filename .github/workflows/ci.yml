name: Kuaiz CMS checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, fileinfo, gd, sodium
          coverage: none
      - name: Verify required capabilities
        run: >-
          php -r "exit(
          in_array('sqlite', PDO::getAvailableDrivers(), true)
          && extension_loaded('fileinfo')
          && extension_loaded('gd') ? 0 : 1);"
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './var/*' -print0 | xargs -0 -n1 php -l
      - name: Run public smoke test
        run: php tests/smoke.php
      - name: Rehearse schema upgrade and refusal of newer databases
        run: php tests/upgrade.php

  project:
    name: Independent project checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, fileinfo, gd, sodium
          coverage: none
      - run: uv sync --frozen --dev
      - run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Test release, installer, website, and PHP foundation
        run: uv run pytest -q
      - name: Validate public website
        run: |
          node --check website/release.js
          uv run python scripts/validate_cms_site.py website
      - name: Run desktop and mobile browser regressions
        run: npm run test:browser
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/playwright-report
            artifacts/playwright-results
          if-no-files-found: ignore
      - name: Build and lint a signed installer
        run: |
          uv run python scripts/php_cms_release_control.py keygen \
            --private /tmp/kuaiz-cms-release-private.pem \
            --public /tmp/kuaiz-cms-release-public.pem
          uv run python scripts/build_php_cms_installer.py \
            --emit-envelope /tmp/kuaiz-cms-release-envelope.json \
            --issued-at 1785900000
          uv run python scripts/php_cms_release_control.py sign \
            --private-key /tmp/kuaiz-cms-release-private.pem \
            --input /tmp/kuaiz-cms-release-envelope.json \
            --output /tmp/kuaiz-cms-release.token
          uv run python scripts/build_php_cms_installer.py \
            --output /tmp/install.php \
            --release-token /tmp/kuaiz-cms-release.token \
            --public-key /tmp/kuaiz-cms-release-public.pem
          php -l /tmp/install.php

  host-matrix:
    name: ${{ matrix.server }} real install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server:
          - apache74-no-rewrite
          - apache74-restricted-parent
          - apache74-no-webp
          - apache74
          - apache
          - openlitespeed
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --dev
      - name: Install and use CMS through real HTTP requests
        run: uv run python scripts/test_php_cms_host_matrix.py --server ${{ matrix.server }}
      - name: Upgrade previous public release and rehearse rollback
        if: matrix.server == 'apache'
        run: >-
          uv run python scripts/test_php_cms_release_upgrade.py
          --skip-build-image
