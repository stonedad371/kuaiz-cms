name: Community CMS checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, fileinfo, gd, sodium
          coverage: none
      - name: Verify required capabilities
        run: >-
          php -r "exit(
          in_array('sqlite', PDO::getAvailableDrivers(), true)
          && extension_loaded('fileinfo')
          && extension_loaded('gd')
          && extension_loaded('sodium')
          && function_exists('imagewebp') ? 0 : 1);"
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './var/*' -print0 | xargs -0 -n1 php -l
      - name: Run public smoke test
        run: php tests/smoke.php
